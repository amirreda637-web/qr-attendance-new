<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Camera Test</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 20px;
    }

    #camera {
      width: 100%;
      max-width: 500px;
      border-radius: 15px;
      background: black;
    }

    button {
      margin-top: 20px;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      font-size: 16px;
    }

  </style>

</head>


<body>

  <h1>📷 Camera Test</h1>

  <video
    id="camera"
    autoplay
    playsinline>
  </video>

  <br>

  <button onclick="startCamera()">
    Start Camera
  </button>

  <div id="status">
    Camera is not started
  </div>


  <script>

    const video =
      document.getElementById("camera");

    const status =
      document.getElementById("status");


    async function startCamera() {

      status.innerHTML =
        "⏳ Requesting camera permission...";


      try {

        const stream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: {
                ideal: "environment"
              }
            },

            audio: false

          });


        video.srcObject = stream;


        status.innerHTML =
          "✅ Camera is working!";


      } catch (error) {

        console.error(error);


        status.innerHTML =
          "❌ Camera Error:<br><br>" +
          error.name +
          "<br>" +
          error.message;

      }

    }

  </script>

</body>

</html>
