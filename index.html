<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>QR Image Test</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f2f2f2;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    input {
      margin: 20px 0;
      font-size: 18px;
    }

    img {
      max-width: 100%;
      margin-top: 20px;
      border-radius: 10px;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #eee;
      font-size: 18px;
      line-height: 1.5;
    }

  </style>

</head>


<body>

  <div class="box">

    <h1>QR Image Test</h1>

    <p>
      Take a clear photo of the QR code,
      then select it below.
    </p>

    <input
      type="file"
      id="imageInput"
      accept="image/*">

    <img
      id="preview"
      style="display:none;">

    <div id="status">
      Waiting for QR image...
    </div>

  </div>


  <script>

    const imageInput =
      document.getElementById("imageInput");

    const preview =
      document.getElementById("preview");

    const status =
      document.getElementById("status");


    // ==========================================
    // LOAD JSQR
    // ==========================================

    const script =
      document.createElement("script");

    script.src =
      "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";


    script.onload =
      function() {

        status.innerHTML =
          "✅ QR decoder loaded.<br>" +
          "Select a QR image.";

      };


    script.onerror =
      function() {

        status.innerHTML =
          "❌ Could not load QR decoder.";

      };


    document.head.appendChild(script);


    // ==========================================
    // IMAGE SELECTED
    // ==========================================

    imageInput.addEventListener(
      "change",
      function(event) {

        const file =
          event.target.files[0];


        if (!file) {
          return;
        }


        status.innerHTML =
          "⏳ Reading image...";


        const reader =
          new FileReader();


        reader.onload =
          function(e) {

            preview.src =
              e.target.result;

            preview.style.display =
              "block";


            preview.onload =
              function() {

                scanImage();

              };

          };


        reader.readAsDataURL(file);

      }
    );


    // ==========================================
    // SCAN IMAGE
    // ==========================================

    function scanImage() {

      if (
        typeof jsQR === "undefined"
      ) {

        status.innerHTML =
          "❌ jsQR is not loaded.";

        return;

      }


      const canvas =
        document.createElement("canvas");


      const ctx =
        canvas.getContext(
          "2d",
          {
            willReadFrequently: true
          }
        );


      const maxSize =
        1600;


      let width =
        preview.naturalWidth;


      let height =
        preview.naturalHeight;


      // ======================================
      // RESIZE LARGE IMAGE
      // ======================================

      if (width > maxSize) {

        const ratio =
          maxSize / width;

        width =
          maxSize;

        height =
          height * ratio;

      }


      canvas.width =
        width;

      canvas.height =
        height;


      ctx.drawImage(
        preview,
        0,
        0,
        width,
        height
      );


      const imageData =
        ctx.getImageData(
          0,
          0,
          width,
          height
        );


      // ======================================
      // NORMAL SCAN
      // ======================================

      let result =
        jsQR(
          imageData.data,
          imageData.width,
          imageData.height,
          {
            inversionAttempts:
              "attemptBoth"
          }
        );


      // ======================================
      // RESULT
      // ======================================

      if (result) {

        status.innerHTML =
          "🎯 QR DETECTED!<br><br>" +
          "<strong>CONTENT:</strong><br>" +
          result.data;

        return;

      }


      status.innerHTML =
        "❌ QR NOT DETECTED.<br><br>" +
        "The image was loaded correctly, " +
        "but the decoder could not find a QR code.";

    }

  </script>

</body>

</html>
