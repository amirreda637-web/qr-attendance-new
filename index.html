<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>QR Attendance</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 15px;
    }

    #camera {
      width: 100%;
      max-width: 500px;
      border-radius: 15px;
      background: black;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      font-size: 18px;
      word-break: break-word;
    }

    #canvas {
      display: none;
    }

  </style>

</head>


<body>

  <h1>📷 QR Scanner</h1>

  <video
    id="camera"
    autoplay
    playsinline>
  </video>

  <canvas id="canvas"></canvas>

  <div id="status">
    Starting camera...
  </div>


  <script>

    const video =
      document.getElementById("camera");

    const canvas =
      document.getElementById("canvas");

    const context =
      canvas.getContext("2d", {
        willReadFrequently: true
      });

    const status =
      document.getElementById("status");


    let scanning = false;

    let lastResult = "";


    // ==========================================
    // START CAMERA
    // ==========================================

    async function startCamera() {

      try {

        const stream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: {
                ideal: "environment"
              },

              width: {
                ideal: 1280
              },

              height: {
                ideal: 720
              }

            },

            audio: false

          });


        video.srcObject = stream;

        scanning = true;

        status.innerHTML =
          "📷 Camera ready<br>Point at a QR code";

        requestAnimationFrame(scanQR);


      } catch (error) {

        status.innerHTML =
          "❌ Camera Error:<br><br>" +
          error.name +
          "<br>" +
          error.message;

      }

    }


    // ==========================================
    // READ QR
    // ==========================================

    function scanQR() {

      if (!scanning) {
        return;
      }


      if (video.readyState === video.HAVE_ENOUGH_DATA) {

        canvas.width = video.videoWidth;

        canvas.height = video.videoHeight;


        context.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );


        const imageData =
          context.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
          );


        const code =
          jsQR(
            imageData.data,
            imageData.width,
            imageData.height,
            {
              inversionAttempts: "attemptBoth"
            }
          );


        if (code) {

          const result =
            code.data.trim();


          if (result !== lastResult) {

            lastResult = result;

            status.innerHTML =
              "✅ QR FOUND<br><br>" +
              result;

            scanning = false;

            stopCamera();

            return;
          }

        }

      }


      requestAnimationFrame(scanQR);

    }


    // ==========================================
    // STOP CAMERA
    // ==========================================

    function stopCamera() {

      const stream =
        video.srcObject;

      if (stream) {

        const tracks =
          stream.getTracks();

        tracks.forEach(function(track) {

          track.stop();

        });

      }

    }


    // ==========================================
    // START
    // ==========================================

    startCamera();

  </script>

</body>

</html>
