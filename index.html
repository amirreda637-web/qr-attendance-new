<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>QR Attendance</title>

  <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
    }

    h1 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: black;
      border-radius: 15px;
      overflow: hidden;
    }

    video {
      width: 100%;
      display: block;
    }

    #status {
      max-width: 500px;
      margin: 20px auto;
      padding: 15px;
      background: white;
      border-radius: 10px;
      font-size: 18px;
      line-height: 1.5;
    }

    button {
      margin-top: 15px;
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

  </style>

</head>


<body>

  <h1>QR Attendance</h1>

  <div id="reader">

    <video
      id="video"
      autoplay
      playsinline>
    </video>

  </div>

  <div id="status">
    ⏳ Starting...
  </div>

  <button onclick="startScanner()">
    Start Camera
  </button>


  <script>

    const video =
      document.getElementById("video");

    const status =
      document.getElementById("status");


    let controls = null;

    let scanning = false;


    // ==========================================
    // CHECK ZXING
    // ==========================================

    if (
      typeof ZXingBrowser === "undefined"
    ) {

      status.innerHTML =
        "❌ ZXing library did not load.";

    } else {

      status.innerHTML =
        "✅ ZXing library loaded.<br>" +
        "Click Start Camera.";

    }


    // ==========================================
    // START SCANNER
    // ==========================================

    async function startScanner() {

      if (scanning) {
        return;
      }

      scanning = true;

      status.innerHTML =
        "⏳ Starting camera...";


      try {

        const reader =
          new ZXingBrowser.BrowserMultiFormatReader();


        const devices =
          await ZXingBrowser.BrowserCodeReader
            .listVideoInputDevices();


        if (!devices || devices.length === 0) {

          throw new Error(
            "No camera found"
          );

        }


        // ======================================
        // TRY TO FIND REAR CAMERA
        // ======================================

        let selectedDevice =
          devices[devices.length - 1];


        for (
          let i = 0;
          i < devices.length;
          i++
        ) {

          const label =
            devices[i].label.toLowerCase();

          if (
            label.includes("back") ||
            label.includes("rear") ||
            label.includes("environment")
          ) {

            selectedDevice =
              devices[i];

            break;

          }

        }


        status.innerHTML =
          "📷 Camera found.<br>" +
          "🔍 Searching for QR...";


        // ======================================
        // START CONTINUOUS SCANNING
        // ======================================

        controls =
          await reader.decodeFromVideoDevice(
            selectedDevice.deviceId,
            video,
            function(result, error) {

              if (result) {

                scanning = false;

                status.innerHTML =
                  "🎯 QR DETECTED!<br><br>" +
                  "<strong>CONTENT:</strong><br>" +
                  result.getText();


                if (controls) {

                  controls.stop();

                }

                return;

              }

            }
          );


      } catch (error) {

        scanning = false;

        status.innerHTML =
          "❌ CAMERA ERROR<br><br>" +
          error.name +
          "<br>" +
          error.message;

      }

    }


    // ==========================================
    // STOP
    // ==========================================

    function stopScanner() {

      scanning = false;

      if (controls) {

        controls.stop();

        controls = null;

      }

      if (video.srcObject) {

        video.srcObject
          .getTracks()
          .forEach(function(track) {

            track.stop();

          });

      }

      status.innerHTML =
        "⏹ Scanner stopped.";

    }

  </script>

</body>

</html>
