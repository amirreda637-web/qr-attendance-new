<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>QR Diagnostic Test</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
    }

    h1 {
      font-size: 24px;
    }

    #camera {
      width: 100%;
      max-width: 500px;
      background: black;
      border-radius: 15px;
    }

    #status {
      margin-top: 15px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      text-align: left;
      font-size: 16px;
      line-height: 1.6;
    }

    #canvas {
      width: 100%;
      max-width: 500px;
      margin-top: 15px;
      border-radius: 10px;
      display: none;
    }

  </style>

</head>


<body>

  <h1>QR Diagnostic Test</h1>

  <video
    id="camera"
    autoplay
    playsinline>
  </video>

  <canvas id="canvas"></canvas>

  <div id="status">
    Starting...
  </div>


  <script>

    const video =
      document.getElementById("camera");

    const canvas =
      document.getElementById("canvas");

    const ctx =
      canvas.getContext("2d", {
        willReadFrequently: true
      });

    const status =
      document.getElementById("status");


    let scanning = false;


    // ==========================================
    // CHECK jsQR
    // ==========================================

    if (typeof jsQR === "undefined") {

      status.innerHTML =
        "❌ jsQR library did NOT load.<br><br>" +
        "The QR library is not available.";

    } else {

      status.innerHTML =
        "✅ jsQR library loaded.<br>" +
        "⏳ Starting camera...";

      startCamera();

    }


    // ==========================================
    // CAMERA
    // ==========================================

    async function startCamera() {

      try {

        const stream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: {
                ideal: "environment"
              },

              width: {
                ideal: 1280
              },

              height: {
                ideal: 720
              }

            },

            audio: false

          });


        video.srcObject = stream;


        await video.play();


        scanning = true;


        status.innerHTML =
          "✅ jsQR library loaded<br>" +
          "✅ Camera working<br>" +
          "📐 Video size: " +
          video.videoWidth +
          " × " +
          video.videoHeight +
          "<br><br>" +
          "🔍 Searching for QR...";


        requestAnimationFrame(scan);

      } catch (error) {

        status.innerHTML =
          "❌ CAMERA ERROR<br><br>" +
          error.name +
          "<br>" +
          error.message;

      }

    }


    // ==========================================
    // QR SCAN
    // ==========================================

    function scan() {

      if (!scanning) {
        return;
      }


      if (
        video.readyState >= 2 &&
        video.videoWidth > 0 &&
        video.videoHeight > 0
      ) {

        canvas.width =
          video.videoWidth;

        canvas.height =
          video.videoHeight;


        ctx.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );


        const image =
          ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
          );


        const code =
          jsQR(
            image.data,
            image.width,
            image.height,
            {
              inversionAttempts:
                "attemptBoth"
            }
          );


        if (code) {

          status.innerHTML =
            "🎯 QR DETECTED!<br><br>" +
            "CONTENT:<br>" +
            code.data;

          scanning = false;

          stopCamera();

          return;

        }

      }


      requestAnimationFrame(scan);

    }


    // ==========================================
    // STOP CAMERA
    // ==========================================

    function stopCamera() {

      if (!video.srcObject) {
        return;
      }

      video.srcObject
        .getTracks()
        .forEach(function(track) {

          track.stop();

        });

    }

  </script>

</body>

</html>
