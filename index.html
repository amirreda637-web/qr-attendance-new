<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>QR Scanner Test</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 15px;
      overflow: hidden;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      font-size: 18px;
      word-break: break-all;
    }

  </style>

</head>


<body>

  <h1>📷 QR Scanner Test</h1>

  <div id="reader"></div>

  <div id="result">
    Waiting for QR...
  </div>


  <script>

    let scanner = null;

    let scanLocked = false;


    function startScanner() {

      scanner = new Html5Qrcode("reader");


      const config = {

        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1.0

      };


      scanner.start(

        {
          facingMode: "environment"
        },

        config,

        function(decodedText) {

          // منع قراءة نفس QR عدة مرات متتالية
          if (scanLocked) {
            return;
          }

          scanLocked = true;


          document.getElementById("result").innerHTML =
            "✅ QR FOUND:<br><br>" +
            decodedText;


          // إيقاف المسح بعد القراءة
          scanner.stop().catch(function(error) {

            console.log(error);

          });

        },

        function(errorMessage) {

          // تجاهل أخطاء البحث العادية
          // لأن المكتبة بتبعثها أثناء محاولة القراءة

        }

      ).catch(function(error) {

        document.getElementById("result").innerHTML =
          "❌ Scanner Error:<br><br>" +
          error;

      });

    }


    startScanner();

  </script>

</body>

</html>
