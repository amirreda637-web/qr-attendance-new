<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>QR Attendance</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
    }

    h1 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: black;
      border-radius: 15px;
      overflow: hidden;
    }

    #status {
      max-width: 500px;
      margin: 20px auto;
      padding: 15px;
      background: white;
      border-radius: 10px;
      font-size: 18px;
      line-height: 1.5;
    }

  </style>

</head>


<body>

  <h1>QR Attendance</h1>

  <div id="reader"></div>

  <div id="status">
    ⏳ Preparing scanner...
  </div>


  <script>

    const status =
      document.getElementById("status");

    let scanner = null;

    let scanLocked = false;


    // ==========================================
    // START
    // ==========================================

    async function startScanner() {

      status.innerHTML =
        "⏳ Requesting camera permission...";


      scanner =
        new Html5Qrcode("reader");


      try {

        // ======================================
        // GET CAMERAS
        // ======================================

        const cameras =
          await Html5Qrcode.getCameras();


        if (
          !cameras ||
          cameras.length === 0
        ) {

          throw new Error(
            "No camera found."
          );

        }


        // ======================================
        // FIND REAR CAMERA
        // ======================================

        let cameraId =
          cameras[cameras.length - 1].id;


        for (
          let i = 0;
          i < cameras.length;
          i++
        ) {

          const label =
            cameras[i].label.toLowerCase();


          if (
            label.includes("back") ||
            label.includes("rear") ||
            label.includes("environment")
          ) {

            cameraId =
              cameras[i].id;

            break;

          }

        }


        status.innerHTML =
          "📷 Camera connected.<br>" +
          "🔍 Searching for QR...";


        // ======================================
        // START SCANNER
        // ======================================

        await scanner.start(

          cameraId,

          {
            fps: 10,

            qrbox: {
              width: 280,
              height: 280
            },

            aspectRatio: 1.7777778

          },


          // ====================================
          // SUCCESS
          // ====================================

          async function(decodedText) {

            if (scanLocked) {
              return;
            }


            scanLocked = true;


            status.innerHTML =
              "🎯 QR DETECTED!<br><br>" +
              "<strong>CONTENT:</strong><br>" +
              decodedText;


            try {

              await scanner.stop();

            } catch (e) {

              console.log(e);

            }

          },


          // ====================================
          // SCAN ERROR
          // ====================================

          function(errorMessage) {

            // Ignore normal scan errors.

          }

        );


        // ======================================
        // IMPORTANT iOS RESET
        // ======================================

        setTimeout(
          async function() {

            try {

              const capabilities =
                scanner.getRunningTrackCapabilities();


              const constraints = {

                width: {
                  ideal: 1000
                },

                frameRate: {
                  ideal:
                    capabilities.frameRate &&
                    capabilities.frameRate.max
                      ? capabilities.frameRate.max
                      : 30
                }

              };


              if (
                capabilities.zoom
              ) {

                constraints.advanced = [

                  {
                    zoom:
                      Math.min(
                        2,
                        capabilities.zoom
                      )
                  }

                ];

              }


              await scanner.applyVideoConstraints(
                constraints
              );


              status.innerHTML =
                "📷 Camera ready.<br>" +
                "🔍 Searching for QR...";

            } catch (error) {

              console.log(
                "Constraint reset:",
                error
              );

              status.innerHTML =
                "📷 Camera working.<br>" +
                "🔍 Searching for QR...";

            }

          },

          1500

        );


      } catch (error) {

        status.innerHTML =
          "❌ CAMERA ERROR<br><br>" +
          error.message;

        console.log(error);

      }

    }


    // ==========================================
    // AUTO START
    // ==========================================

    window.addEventListener(
      "load",
      function() {

        startScanner();

      }
    );

  </script>

</body>

</html>
